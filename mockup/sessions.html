<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Arlo — Sessions</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="shared/tokens.css" />
<style>
  .filterbar { justify-content: flex-start; }
  .filterbar .grow { flex: 1 1 auto; }
  .search-field { width: 220px; }
  .search-field input { border: none; background: transparent; outline: none; width: 100%; font-size: 12.5px; color: var(--fg); }

  .sess-body { padding: 20px 24px; }
  .sess-toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .sess-count { font-size: 12px; color: var(--muted); }
  .sess-count strong { color: var(--fg); }

  .table-wrap { border: 1px solid var(--border); border-radius: 16px; overflow: hidden; background: var(--surface); }
  .table-scroll-x { overflow-x: auto; }
  #sessTable { min-width: 1180px; }
  #sessTable th, #sessTable td { white-space: nowrap; }
  #sessTable th.emph, #sessTable td.emph { background: var(--accent-wash); }
  .sess-cell { display: flex; flex-direction: column; gap: 1px; max-width: 220px; }
  .sess-cell .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
  .sess-cell .id { font-size: 10.5px; color: var(--muted-2); }
  .link-cell { color: var(--fg); cursor: pointer; border-radius: 6px; padding: 2px 5px; margin: -2px -5px; }
  .link-cell:hover { color: var(--accent); background: var(--accent-wash); text-decoration: underline; }
  .branch-pill { font-family: "SF Mono","JetBrains Mono",monospace; font-size: 11px; }
  .models-used { display: flex; align-items: center; gap: 3px; }
  .models-used .md { width: 8px; height: 8px; border-radius: 2px; }
  .models-used .more { font-size: 10.5px; color: var(--muted-2); margin-left: 2px; }
  .compaction-badge { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--accent-wash); color: var(--accent); font-size: 10.5px; font-weight: 700; }
  .compaction-zero { color: var(--muted-2); }

  .pager { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-top: 1px solid var(--border); }
  .pager .btn-small[disabled] { opacity: 0.4; cursor: default; pointer-events: none; }
</style>
</head>
<body>
<div class="app-shell" data-od-id="sessions-screen">
  <aside class="sidebar" data-od-id="sidebar">
    <div class="sidebar-brand">
      <span class="mark"><svg viewBox="0 0 24 24" fill="none"><path d="M6 18 12 6l6 12" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span>Arlo</span>
    </div>
    <nav class="sidebar-nav">
      <a class="nav-item" href="dashboard.html" data-od-id="nav-dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="20" x2="4" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="20" y1="20" x2="20" y2="14"/></svg>
        <span>Dashboard</span>
      </a>
      <a class="nav-item active" href="sessions.html" data-od-id="nav-sessions">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
        <span>Sessions</span>
      </a>
      <a class="nav-item" href="insights.html" data-od-id="nav-insights">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        <span>Insights</span>
      </a>
      <a class="nav-item" href="settings.html" data-od-id="nav-settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
        <span>Settings</span>
      </a>
    </nav>
    <div class="sidebar-foot">
      <button class="sidebar-collapse-btn" data-sidebar-toggle aria-label="Collapse sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
    </div>
  </aside>

  <div class="main-col">
    <div class="titlebar-spacer"></div>
    <div class="topbar">
      <div class="topbar-title">Sessions</div>
      <div class="topbar-actions">
        <button class="theme-toggle" data-theme-toggle aria-label="Toggle theme">
          <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
          <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="4.2" y1="4.2" x2="5.6" y2="5.6"/><line x1="18.4" y1="18.4" x2="19.8" y2="19.8"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/><line x1="4.2" y1="19.8" x2="5.6" y2="18.4"/><line x1="18.4" y1="5.6" x2="19.8" y2="4.2"/></svg>
        </button>
      </div>
    </div>

    <div class="content-scroll">
      <div class="filterbar" data-od-id="filter-bar">
        <div class="field" data-od-id="filter-date-range">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          <span id="dateRangeLabel">All time</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
        <div class="seg" id="dateRangeSeg">
          <button class="seg-btn" data-range="7d">7d</button>
          <button class="seg-btn" data-range="30d">30d</button>
          <button class="seg-btn" data-range="90d">90d</button>
          <button class="seg-btn active" data-range="all">All</button>
          <button class="seg-btn" data-range="custom">Custom</button>
        </div>
        <div class="sep"></div>
        <div class="seg" id="measureSeg" data-od-id="filter-measure">
          <button class="seg-btn active" data-measure="tokens">Tokens</button>
          <button class="seg-btn" data-measure="requests">Requests</button>
          <button class="seg-btn" data-measure="cost">Cost</button>
        </div>
        <div class="sep"></div>
        <div class="field search-field" data-od-id="filter-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.6" y2="16.6"/></svg>
          <input type="text" id="searchInput" placeholder="Filter sessions…" />
        </div>
        <div class="grow"></div>
      </div>
      <div id="chipRow" style="display:flex; gap:6px; padding: 0 24px 12px; flex-wrap:wrap;" data-od-id="filter-chip-row"></div>

      <div class="sess-body">
        <div class="sess-toolbar">
          <div class="sess-count" data-od-id="sessions-count">Showing <strong id="shownCount">60</strong> of <strong>275</strong> sessions</div>
        </div>
        <div class="table-wrap" data-od-id="sessions-table-card">
          <div class="table-scroll-x">
            <table class="dtable" data-sortable id="sessTable">
              <thead>
                <tr>
                  <th class="sortable" data-sort-key="session">Session <span class="sort-arrow">↕</span></th>
                  <th class="sortable" data-sort-key="project">Project <span class="sort-arrow">↕</span></th>
                  <th class="sortable" data-sort-key="branch">Branch <span class="sort-arrow">↕</span></th>
                  <th class="sortable sort-active" data-sort-key="started">Started <span class="sort-arrow">↓</span></th>
                  <th class="sortable num" data-sort-key="duration">Duration <span class="sort-arrow">↕</span></th>
                  <th class="sortable num" data-sort-key="requests">Requests <span class="sort-arrow">↕</span></th>
                  <th class="sortable num tok-col" data-sort-key="tokens">Tokens <span class="sort-arrow">↕</span></th>
                  <th class="sortable num cost-col" data-sort-key="cost">Cost <span class="sort-arrow">↕</span></th>
                  <th>Models</th>
                  <th>Context high-water</th>
                  <th class="num">Compactions</th>
                </tr>
              </thead>
              <tbody id="sessBody"></tbody>
            </table>
          </div>
          <div class="pager">
            <span class="sess-count" id="pagerLabel">Page 1 of 5</span>
            <div style="display:flex; gap:6px;">
              <button class="btn btn-secondary btn-small" id="prevPage" disabled>Previous</button>
              <button class="btn btn-secondary btn-small" id="nextPage">Next</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="shared/app.js"></script>
<script>
(function () {
  function mulberry32(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const rng = mulberry32(9081976);

  const MODELS = [
    { key: "opus-5", name: "claude-opus-5", color: "var(--series-1)", limit: 1000000, w: 0.24 },
    { key: "sonnet-5", name: "claude-sonnet-5", color: "var(--series-2)", limit: 1000000, w: 0.40 },
    { key: "fable-5", name: "claude-fable-5", color: "var(--series-3)", limit: 500000, w: 0.10 },
    { key: "opus-4-8", name: "claude-opus-4-8", color: "var(--series-4)", limit: 200000, w: 0.12 },
    { key: "haiku-4-5", name: "claude-haiku-4-5", color: "var(--series-5)", limit: 200000, w: 0.11 },
    { key: "sonnet-4-6", name: "claude-sonnet-4-6", color: "var(--series-6)", limit: 1000000, w: 0.03 },
  ];
  const PROJECTS = ["arlo-ai-analyzer","api-gateway","design-system","infra-terraform","docs-site","mobile-app","billing-service","notifications","search-index","onboarding-flow","admin-console","data-pipeline","auth-service","ci-runners","growth-experiments"];
  const BRANCHES = ["main","feat/context-meter","feat/insights-cards","fix/cache-pricing","chore/deps","feat/session-timeline","fix/context-alert","feat/pricing-table","refactor/store","feat/export-csv"];

  function pick(arr) { return arr[Math.floor(rng() * arr.length)]; }
  function weightedModel() {
    const r = rng(); let acc = 0;
    for (const m of MODELS) { acc += m.w; if (r <= acc) return m; }
    return MODELS[0];
  }
  function pad(n) { return n.toString().padStart(2, "0"); }
  function fmtStarted(d) { return d.toLocaleDateString("en-US", { month: "short", day: "numeric" }) + ", " + d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }); }
  function fmtDuration(mins) { return mins >= 60 ? Math.floor(mins / 60) + "h " + (mins % 60) + "m" : mins + "m"; }
  function fmtTokens(v) { return v >= 1e6 ? (v / 1e6).toFixed(2) + "M" : v >= 1e3 ? (v / 1e3).toFixed(1) + "K" : v.toString(); }
  function band(pct) { return pct >= 90 ? "critical" : pct >= 75 ? "warning" : pct >= 50 ? "normal" : "quiet"; }

  const NOW = new Date("2026-08-18T17:40:00");
  const ROWS = [];

  // Seed the exact session referenced by the live context-alert banner, so drilling through is coherent.
  ROWS.push({
    id: "sess_f81c2e", session: "arlo-ai-analyzer", project: "arlo-ai-analyzer", branch: "feat/context-meter",
    started: new Date("2026-08-18T15:12:00"), duration: 148, requests: 212, tokens: 812000, cost: 18.42,
    models: [MODELS[0]], hw: 784000, hwLimit: 1000000, compactions: 1,
  });

  for (let i = 1; i < 60; i++) {
    const project = pick(PROJECTS);
    const branch = rng() < 0.55 ? "main" : pick(BRANCHES);
    const startedDaysAgo = Math.floor(rng() * 47);
    const started = new Date(NOW); started.setDate(started.getDate() - startedDaysAgo);
    started.setHours(7 + Math.floor(rng() * 13), Math.floor(rng() * 60), 0, 0);
    const duration = 4 + Math.floor(rng() * rng() * 220);
    const requests = 6 + Math.floor(rng() * rng() * 340);
    const primary = weightedModel();
    const nModels = rng() < 0.7 ? 1 : rng() < 0.9 ? 2 : 3;
    const models = [primary];
    while (models.length < nModels) { const m = weightedModel(); if (!models.includes(m)) models.push(m); }
    const tokens = Math.round(requests * (8000 + rng() * 42000));
    const cost = +(tokens / 1e6 * (0.9 + rng() * 2.4)).toFixed(2);
    let hwPct = rng() < 0.08 ? 55 + rng() * 40 : rng() * 40;
    const hw = Math.round((hwPct / 100) * primary.limit);
    const compactions = hwPct > 70 ? Math.floor(rng() * 3) : rng() < 0.05 ? 1 : 0;
    ROWS.push({ id: "sess_" + Math.floor(rng() * 0xffffff).toString(16).padStart(6, "0"), session: project + "-" + Math.floor(rng() * 0xfff).toString(16), project, branch, started, duration, requests, tokens, cost, models, hw, hwLimit: primary.limit, compactions });
  }

  const state = { measure: "tokens", sortKey: "started", sortAsc: false, search: "", page: 1, perPage: 15 };

  function fmtMeasureCol(r) { return state.measure === "cost" ? "$" + r.cost.toFixed(2) : state.measure === "requests" ? r.requests.toLocaleString() : fmtTokens(r.tokens); }

  function applyFilterSort() {
    let rows = ROWS.filter(r => {
      if (!state.search) return true;
      const q = state.search.toLowerCase();
      return r.session.toLowerCase().includes(q) || r.project.toLowerCase().includes(q) || r.branch.toLowerCase().includes(q);
    });
    rows = rows.slice().sort((a, b) => {
      let av, bv;
      switch (state.sortKey) {
        case "session": av = a.session; bv = b.session; break;
        case "project": av = a.project; bv = b.project; break;
        case "branch": av = a.branch; bv = b.branch; break;
        case "started": av = a.started.getTime(); bv = b.started.getTime(); break;
        case "duration": av = a.duration; bv = b.duration; break;
        case "requests": av = a.requests; bv = b.requests; break;
        case "tokens": av = a.tokens; bv = b.tokens; break;
        case "cost": av = a.cost; bv = b.cost; break;
        default: av = a.started.getTime(); bv = b.started.getTime();
      }
      const cmp = typeof av === "string" ? av.localeCompare(bv) : av - bv;
      return state.sortAsc ? cmp : -cmp;
    });
    return rows;
  }

  function render() {
    const rows = applyFilterSort();
    document.getElementById("shownCount").textContent = rows.length;
    const start = (state.page - 1) * state.perPage;
    const pageRows = rows.slice(start, start + state.perPage);
    const totalPages = Math.max(1, Math.ceil(rows.length / state.perPage));
    document.getElementById("pagerLabel").textContent = `Page ${state.page} of ${totalPages}`;
    document.getElementById("prevPage").disabled = state.page <= 1;
    document.getElementById("nextPage").disabled = state.page >= totalPages;

    document.querySelectorAll("#sessTable .tok-col").forEach(el => el.classList.toggle("emph", state.measure === "tokens"));
    document.querySelectorAll("#sessTable .cost-col").forEach(el => el.classList.toggle("emph", state.measure === "cost"));

    const tbody = document.getElementById("sessBody");
    tbody.innerHTML = "";
    pageRows.forEach(r => {
      const tr = document.createElement("tr");
      tr.className = "table-row-link";
      tr.tabIndex = 0;
      const pct = Math.round((r.hw / r.hwLimit) * 100);
      const b = band(pct);
      const modelsHtml = r.models.slice(0, 3).map(m => `<span class="md" style="background:${m.color}" title="${m.name}"></span>`).join("") + (r.models.length > 3 ? `<span class="more">+${r.models.length - 3}</span>` : "");
      tr.innerHTML = `
        <td><div class="sess-cell"><span class="name">${r.session}</span><span class="id mono">${r.id}</span></div></td>
        <td><span class="link-cell" data-filter="project" data-value="${r.project}">${r.project}</span></td>
        <td><span class="link-cell branch-pill" data-filter="branch" data-value="${r.branch}">${r.branch}</span></td>
        <td class="tnum">${fmtStarted(r.started)}</td>
        <td class="num tnum">${fmtDuration(r.duration)}</td>
        <td class="num tnum">${r.requests.toLocaleString()}</td>
        <td class="num tnum tok-col ${state.measure === "tokens" ? "emph" : ""}">${fmtTokens(r.tokens)}</td>
        <td class="num tnum cost-col ${state.measure === "cost" ? "emph" : ""}">$${r.cost.toFixed(2)}</td>
        <td><div class="models-used">${modelsHtml}</div></td>
        <td><div class="meter"><div class="meter-track"><div class="meter-fill band-${b}" style="width:${Math.min(pct,100)}%"></div></div><span class="meter-label band-${b}">${pct}%</span></div></td>
        <td class="num">${r.compactions > 0 ? `<span class="compaction-badge">${r.compactions}</span>` : `<span class="compaction-zero">—</span>`}</td>`;
      tr.querySelectorAll(".link-cell").forEach(el => el.addEventListener("click", (e) => { e.stopPropagation(); addChip(el.dataset.filter, el.dataset.value); }));
      tr.addEventListener("click", () => { window.location.href = "session-detail.html"; });
      tr.addEventListener("keydown", (e) => { if (e.key === "Enter") window.location.href = "session-detail.html"; });
      tbody.appendChild(tr);
    });
  }

  function addChip(kind, value) {
    state.search = value;
    document.getElementById("searchInput").value = value;
    const chipRow = document.getElementById("chipRow");
    chipRow.innerHTML = "";
    const chip = document.createElement("div");
    chip.className = "chip";
    chip.innerHTML = `<span>${kind[0].toUpperCase() + kind.slice(1)}: ${value}</span><button aria-label="Remove filter">×</button>`;
    chip.querySelector("button").addEventListener("click", () => { state.search = ""; document.getElementById("searchInput").value = ""; chipRow.innerHTML = ""; state.page = 1; render(); });
    chipRow.appendChild(chip);
    state.page = 1;
    render();
  }

  document.querySelectorAll("#sessTable th.sortable").forEach(th => {
    th.addEventListener("click", () => {
      const key = th.dataset.sortKey;
      state.sortAsc = state.sortKey === key ? !state.sortAsc : false;
      state.sortKey = key;
      document.querySelectorAll("#sessTable th.sortable").forEach(t => { t.classList.remove("sort-active"); const a = t.querySelector(".sort-arrow"); if (a) a.textContent = "↕"; });
      th.classList.add("sort-active");
      const arrow = th.querySelector(".sort-arrow"); if (arrow) arrow.textContent = state.sortAsc ? "↑" : "↓";
      render();
    });
  });
  document.getElementById("searchInput").addEventListener("input", (e) => { state.search = e.target.value; state.page = 1; render(); document.getElementById("chipRow").innerHTML = ""; });
  document.getElementById("measureSeg").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-measure]"); if (!btn) return;
    document.querySelectorAll("#measureSeg .seg-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active"); state.measure = btn.dataset.measure; render();
  });
  document.getElementById("dateRangeSeg").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-range]"); if (!btn) return;
    document.querySelectorAll("#dateRangeSeg .seg-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById("dateRangeLabel").textContent = { "7d": "Last 7 days", "30d": "Last 30 days", "90d": "Last 90 days", "all": "All time", "custom": "Custom range" }[btn.dataset.range];
  });
  document.getElementById("prevPage").addEventListener("click", () => { state.page = Math.max(1, state.page - 1); render(); });
  document.getElementById("nextPage").addEventListener("click", () => { state.page += 1; render(); });

  render();
})();
</script>
</body>
</html>
