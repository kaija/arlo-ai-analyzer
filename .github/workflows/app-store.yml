# Builds a signed Mac App Store package. Pushes to `release` also upload it
# to App Store Connect; manual runs build only unless upload is selected.
#
# Setup (secrets and variables live on the `app-store` environment):
#   MAC_APP_CERT_P12 / MAC_APP_CERT_PASSWORD             3rd Party Mac Developer Application, .p12 as base64
#   MAC_INSTALLER_CERT_P12 / MAC_INSTALLER_CERT_PASSWORD 3rd Party Mac Developer Installer, .p12 as base64
#   MAC_PROVISIONING_PROFILE                             embedded.provisionprofile as base64
#   ASC_KEY_ID / ASC_ISSUER_ID / ASC_PRIVATE_KEY         App Store Connect API key (the .p8's text)
#   vars.BUILD_NUMBER_OFFSET                             build number = run number + this (default 5)
#
# The build number only ever goes up with the run number. After uploading a
# build by hand, raise BUILD_NUMBER_OFFSET past it or the next upload is
# rejected as a duplicate.
name: App Store

on:
  push:
    branches: [release]
  workflow_dispatch:
    inputs:
      upload:
        description: Upload the package to App Store Connect after building
        type: boolean
        default: false

permissions:
  contents: write # the appstore/* tag pushed after an upload

concurrency:
  group: app-store
  cancel-in-progress: false

jobs:
  package:
    runs-on: macos-15
    environment: app-store
    timeout-minutes: 90
    env:
      BUILD_NUMBER_OFFSET: ${{ vars.BUILD_NUMBER_OFFSET || '5' }}
      UPLOAD_TO_ASC: ${{ github.event_name == 'push' || inputs.upload }}
    steps:
      - uses: actions/checkout@v7

      - name: Check signing and upload settings
        env:
          MAC_APP_CERT_P12: ${{ secrets.MAC_APP_CERT_P12 }}
          MAC_APP_CERT_PASSWORD: ${{ secrets.MAC_APP_CERT_PASSWORD }}
          MAC_INSTALLER_CERT_P12: ${{ secrets.MAC_INSTALLER_CERT_P12 }}
          MAC_INSTALLER_CERT_PASSWORD: ${{ secrets.MAC_INSTALLER_CERT_PASSWORD }}
          MAC_PROVISIONING_PROFILE: ${{ secrets.MAC_PROVISIONING_PROFILE }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=0
          required=(MAC_APP_CERT_P12 MAC_APP_CERT_PASSWORD MAC_INSTALLER_CERT_P12 MAC_INSTALLER_CERT_PASSWORD MAC_PROVISIONING_PROFILE)
          if [[ "$UPLOAD_TO_ASC" == true ]]; then
            required+=(ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY)
          fi
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "::error title=Missing secret::$name must be set on the app-store environment"
              missing=1
            fi
          done
          if [[ ! "$BUILD_NUMBER_OFFSET" =~ ^[0-9]+$ ]]; then
            echo "::error title=Invalid build offset::BUILD_NUMBER_OFFSET must be a non-negative integer"
            missing=1
          fi
          exit "$missing"

      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile

      # Nothing broken goes to review.
      - run: make lint
      - run: make test

      - name: Build number
        run: echo "BUILD_NUMBER=$(( GITHUB_RUN_NUMBER + BUILD_NUMBER_OFFSET ))" >> "$GITHUB_ENV"

      - name: Import signing certificates
        env:
          MAC_APP_CERT_P12: ${{ secrets.MAC_APP_CERT_P12 }}
          MAC_APP_CERT_PASSWORD: ${{ secrets.MAC_APP_CERT_PASSWORD }}
          MAC_INSTALLER_CERT_P12: ${{ secrets.MAC_INSTALLER_CERT_P12 }}
          MAC_INSTALLER_CERT_PASSWORD: ${{ secrets.MAC_INSTALLER_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          import_p12() {
            printf '%s' "$1" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$2" -f pkcs12 \
              -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/security
            rm -f "$RUNNER_TEMP/cert.p12"
          }
          import_p12 "$MAC_APP_CERT_P12" "$MAC_APP_CERT_PASSWORD"
          import_p12 "$MAC_INSTALLER_CERT_P12" "$MAC_INSTALLER_CERT_PASSWORD"

          # The chain both certificates are issued under, in case the image lacks it.
          curl -fsSL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o "$RUNNER_TEMP/wwdr.cer"
          security import "$RUNNER_TEMP/wwdr.cer" -k "$KEYCHAIN" || true

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Install provisioning profile
        env:
          MAC_PROVISIONING_PROFILE: ${{ secrets.MAC_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          printf '%s' "$MAC_PROVISIONING_PROFILE" | base64 --decode > src-tauri/embedded.provisionprofile

      - name: Build package
        id: build
        run: scripts/build-appstore.sh "$BUILD_NUMBER" dist-appstore

      # Kept even if the upload fails, so the exact package can be retried by hand.
      - uses: actions/upload-artifact@v5
        with:
          name: app-store-${{ steps.build.outputs.version }}-build${{ env.BUILD_NUMBER }}
          path: ${{ steps.build.outputs.pkg }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload to App Store Connect
        if: env.UPLOAD_TO_ASC == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          PKG: ${{ steps.build.outputs.pkg }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$ASC_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/"AuthKey_$ASC_KEY_ID.p8"
          xcrun altool --upload-app -t macos -f "$PKG" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Tag the uploaded commit
        if: env.UPLOAD_TO_ASC == 'true'
        env:
          TAG: appstore/${{ steps.build.outputs.version }}-build${{ env.BUILD_NUMBER }}
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

      - name: Clean up
        if: always()
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          [ -n "${KEYCHAIN:-}" ] && security delete-keychain "$KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/cert.p12" src-tauri/embedded.provisionprofile
          [ -z "${ASC_KEY_ID:-}" ] || rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
